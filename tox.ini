[tox]
envlist =
    py27-zope213
    py27-zope4
    py38-zope4
    py311-zope512
    py311-zope513
    flake8
# virtualenv >= 20.22 cannot create Python 2.7 environments
requires =
    virtualenv < 20.22

[testenv]
skip_install = false
usedevelop = true
setenv =
    # old C extensions (ZODB3, ExtensionClass, AccessControl, ...) do not
    # build with C23 / the stricter defaults of GCC >= 14
    zope213,zope4: CFLAGS = -std=gnu99 -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration
deps =
    zope213: -c constraints/zope213.txt
    zope213: Zope2 == 2.13.30
    zope4: -c https://zopefoundation.github.io/Zope/releases/4.8.11/constraints.txt
    zope4: Zope == 4.8.11
    zope512: -c https://zopefoundation.github.io/Zope/releases/5.12/constraints.txt
    zope512: Zope == 5.12
    zope513: -c https://zopefoundation.github.io/Zope/releases/5.13/constraints.txt
    zope513: Zope == 5.13
commands =
    python -m unittest discover -v -s src -t src

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 src setup.py
